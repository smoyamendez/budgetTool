# Payday backend. Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "payday-api"
main = "worker/src/index.ts"
compatibility_date = "2026-09-01"

# The app in public/ is also served from the Worker URL, handy for local testing.
# On your phone you'll use the GitHub Pages copy.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "payday"
# Replace with the id that `npx wrangler d1 create payday` prints. See README.
database_id = "cbc1a501-14d6-4ad4-b66b-09ffe807d658"
migrations_dir = "migrations"

# Pull new bank transactions every day at 11:15 UTC (7:15 AM Eastern in summer).
[triggers]
crons = ["15 11 * * *"]

[vars]
PLAID_ENV = "production"
# Websites allowed to call this API, comma separated. Your GitHub Pages address goes here.
ALLOWED_ORIGINS = "https://smoyamendez.github.io,http://localhost:8787"

# Secrets are set with `npx wrangler secret put NAME`, never written in this file:
#   APP_PASSWORD           the password you sign in with
#   TOKEN_ENCRYPTION_KEY   32 random bytes, base64 (encrypts Plaid access tokens)
#   PLAID_CLIENT_ID
#   PLAID_SECRET
#   PLAID_REDIRECT_URI     optional, for banks that sign in on their own site
