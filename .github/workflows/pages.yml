# Publishes the app in public/ to GitHub Pages on every push to main.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the app at your Worker
        env:
          PAYDAY_API_URL: ${{ vars.PAYDAY_API_URL }}
        run: |
          if [ -z "$PAYDAY_API_URL" ]; then
            echo "::warning::Set the PAYDAY_API_URL repository variable to your Worker address (see README)."
          fi
          printf "window.PAYDAY_API = '%s';\n" "${PAYDAY_API_URL%/}" > public/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
